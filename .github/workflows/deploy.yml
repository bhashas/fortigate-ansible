# ============================================================
#  GitHub Actions - CI/CD Pipeline
#  FortiGate 60E + Cisco SG350 Ansible Automation
#
#  Secrets GitHub à configurer dans :
#  Settings → Secrets and variables → Actions
#
#  Secrets requis :
#    VAULT_PASSWORD     → mot de passe Ansible Vault
#    FGT_SSH_KEY        → clé SSH privée FortiGate (optionnel)
# ============================================================

name: Network Automation CI/CD

on:
  push:
    branches:
      - main        # Déploiement automatique sur main
      - staging     # Dry-run sur staging
  pull_request:
    branches:
      - main        # Lint + dry-run sur chaque PR

jobs:

  # ─────────────────────────────────────────────
  #  JOB 1 — Lint et validation syntaxe YAML
  # ─────────────────────────────────────────────
  lint:
    name: "Lint & Syntax Check"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout du code"
        uses: actions/checkout@v4

      - name: "Installer Python + Ansible"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Installer dépendances"
        run: |
          pip install ansible ansible-lint yamllint
          ansible-galaxy collection install fortinet.fortios cisco.ios

      - name: "Vérifier syntaxe YAML"
        run: |
          yamllint -d relaxed .

      - name: "Lint Ansible playbooks"
        run: |
          ansible-lint site.yml

      - name: "Vérifier syntaxe playbook"
        run: |
          ansible-playbook site.yml --syntax-check \
            -i inventory/hosts.yml \
            -e "ansible_password=dummy" \
            -e "vault_fgt_password=dummy" \
            -e "vault_sg350_password=dummy"

  # ─────────────────────────────────────────────
  #  JOB 2 — Dry-run (sur PR et branche staging)
  # ─────────────────────────────────────────────
  dry_run:
    name: "Dry-run (--check)"
    runs-on: ubuntu-latest
    needs: lint
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/staging'
    environment: staging

    steps:
      - name: "Checkout du code"
        uses: actions/checkout@v4

      - name: "Installer Python + Ansible"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Installer dépendances"
        run: |
          pip install ansible
          ansible-galaxy collection install fortinet.fortios cisco.ios

      - name: "Créer fichier vault password"
        run: |
          echo "${{ secrets.VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass

      - name: "Dry-run FortiGate + SG350"
        run: |
          ansible-playbook site.yml \
            -i inventory/hosts.yml \
            --vault-password-file .vault_pass \
            --check \
            -v

      - name: "Nettoyage vault password"
        if: always()
        run: rm -f .vault_pass

  # ─────────────────────────────────────────────
  #  JOB 3 — Déploiement réel (sur push main)
  # ─────────────────────────────────────────────
  deploy:
    name: "Deploy"
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
      - name: "Checkout du code"
        uses: actions/checkout@v4

      - name: "Installer Python + Ansible"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Installer dépendances"
        run: |
          pip install ansible
          ansible-galaxy collection install fortinet.fortios cisco.ios

      - name: "Créer fichier vault password"
        run: |
          echo "${{ secrets.VAULT_PASSWORD }}" > .vault_pass
          chmod 600 .vault_pass

      - name: "Déploiement FortiGate + SG350"
        run: |
          ansible-playbook site.yml \
            -i inventory/hosts.yml \
            --vault-password-file .vault_pass \
            -v

      - name: "Nettoyage vault password"
        if: always()
        run: rm -f .vault_pass

      - name: "Résumé déploiement"
        if: success()
        run: |
          echo "✅ Déploiement réussi sur $(date)"
          echo "Commit : ${{ github.sha }}"
          echo "Auteur : ${{ github.actor }}"
