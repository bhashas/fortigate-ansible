# ============================================================
#  GitHub Actions - CI/CD Pipeline
#  FortiGate 60E + Cisco SG350 Ansible Automation
# ============================================================

name: Network Automation CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:

  lint:
    name: "Lint & Syntax Check"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout du code"
        uses: actions/checkout@v4

      - name: "Installer Python + Ansible"
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Installer dépendances"
        run: |
          pip install ansible ansible-lint yamllint
          ansible-galaxy collection install fortinet.fortios cisco.ios

      - name: "Vérifier syntaxe YAML"
        run: yamllint -d relaxed .

      - name: "Lint Ansible playbooks"
        run: ansible-lint site.yml

      - name: "Vérifier syntaxe playbook"
        run: |
          ansible-playbook site.yml --syntax-check \
            -i inventory/hosts.yml \
            -e "ansible_password=dummy" \
            -e "vault_fgt_password=dummy" \
            -e "vault_sg350_password=dummy"

  summary:
    name: "Deploy (manuel requis — équipements physiques)"
    runs-on: ubuntu-latest
    needs: lint
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: "Résumé"
        run: |
          echo "✅ Lint OK — déploiement réel sur FortiGate/SG350 déclenché manuellement"
          echo "Commit : ${{ github.sha }}"
          echo "Auteur : ${{ github.actor }}"
